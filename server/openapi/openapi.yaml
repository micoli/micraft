  /api/character/rpgcreate:
    post:
      tags: []
      description: Create a new RPG character (point-buy base stats + class)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/org.micoli.micraft.http.CreateRpgCharacterRequest"
        required: false
      responses:
        "200":
          headers: {}
          content:
