openapi: 3.1.0
info:
  title: MicCraft API
  description: "Server HTTP API — auth, game entities, admin, map/chunks."
  version: 1.0.0
externalDocs:
  url: /
servers: []
tags: []
paths:
  /api/auth/config:
    get:
      tags: []
      description: "Active auth provider, used by the client to pick the right login\
        \ UI"
      parameters: []
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org.micoli.micraft.auth.AuthConfigResponse"
      deprecated: false
  /auth/noauth-login:
    post:
      tags: []
      description: Create/reuse an account by email when auth is disabled (auth.provider=none)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/org.micoli.micraft.auth.NoAuthLoginRequest"
        required: false
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org.micoli.micraft.auth.NoAuthLoginResponse"
        "400":
          description: Missing or invalid email
          headers: {}
      deprecated: false
  /api/assets/manifest:
    get:
      tags: []
      parameters: []
      responses: {}
      deprecated: false
  /api/assets/reload:
    post:
      tags: []
      parameters: []
      responses: {}
      deprecated: false
  /api/admin/ws/npcs:
    get:
      tags: []
      parameters: []
      responses: {}
      deprecated: false
  /api/admin/ws/scenes/{id}:
    get:
      tags: []
      parameters: []
      responses: {}
      deprecated: false
  /api/admin/ws/instances/{id}:
    get:
      tags: []
      parameters: []
      responses: {}
      deprecated: false
  /api/admin/ws/simulation:
    get:
      tags: []
      parameters: []
      responses: {}
      deprecated: false
  /api/keybindings:
    get:
      tags: []
      description: "Key bindings — a player's saved bindings if ?player= is given\
        \ and persistence is available, otherwise the default config"
      parameters:
      - name: player
        in: query
        description: Optional player name to load saved bindings for
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                    title: String
                  title: List<String>
                title: "Map<String,List<String>>"
      deprecated: false
  /api/autocomplete/{commandId}/{argIndex}:
    get:
      tags: []
      description: Autocomplete suggestions for a slash command argument
      parameters:
      - name: commandId
        in: path
        description: Slash command id
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      - name: argIndex
        in: path
        description: Zero-based argument index
        required: true
        deprecated: false
        explode: false
        schema:
          type: integer
          format: int32
          title: Int
      - name: partial
        in: query
        description: Partial text typed so far
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      - name: player
        in: query
        description: Requesting player name
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  title: String
                title: List<String>
        "400":
          description: Missing commandId or argIndex
          headers: {}
      deprecated: false
  /api/i18n/{locale}:
    get:
      tags: []
      description: Client-facing translation keys for a locale
      parameters:
      - name: locale
        in: path
        description: "Locale code, e.g. en/fr"
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                  title: String
                title: "Map<String,String>"
      deprecated: false
  /api/layout/registry:
    get:
      tags: []
      description: All widgets registered for the UI layout editor
      parameters: []
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/org.micoli.micraft.ui.WidgetRegistryEntry"
                title: List<WidgetRegistryEntry>
      deprecated: false
  /api/items/meta:
    get:
      tags: []
      description: "Item metadata (label, background color, consumable flags) by item\
        \ type id"
      parameters: []
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: string
                    title: String
                  title: "Map<String,String>"
                title: "Map<String,Map<String,String>>"
      deprecated: false
  /api/server/info:
    get:
      tags: []
      description: Server build timestamp
      parameters: []
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org.micoli.micraft.http.ServerInfo"
      deprecated: false
  /api/attacks:
    get:
      tags: []
      description: "Attack definitions, flattened by \"attackId:level\" key"
      parameters: []
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: string
                    title: String
                  title: "Map<String,String>"
                title: "Map<String,Map<String,String>>"
      deprecated: false
  /api/classes:
    get:
      tags: []
      description: "Attack ids accessible per RPG class, keyed by level"
      parameters: []
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      $ref: "#/components/schemas/org.micoli.micraft.game.classes.ClassAttackAccess"
                    title: List<ClassAttackAccess>
                  title: "Map<String,List<ClassAttackAccess>>"
                title: "Map<String,Map<String,List<ClassAttackAccess>>>"
      deprecated: false
  /api/spells:
    get:
      tags: []
      description: "Spell definitions, keyed by spell id"
      parameters: []
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: string
                    title: String
                  title: "Map<String,String>"
                title: "Map<String,Map<String,String>>"
      deprecated: false
  /api/macros/context:
    get:
      tags: []
      description: Variables available to the macro JEXL evaluation context
      parameters: []
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/org.micoli.micraft.game.macro.MacroContextVar"
                title: List<MacroContextVar>
      deprecated: false
  /api/biomes:
    get:
      tags: []
      description: "Grass color per biome id, as [r, g, b] in 0..1"
      parameters: []
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: number
                    format: double
                    title: Double
                  title: List<Double>
                title: "Map<String,List<Double>>"
      deprecated: false
  /api/player/{id}/skin:
    get:
      tags: []
      description: A player's current skin
      parameters:
      - name: id
        in: path
        description: Player id
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org.micoli.micraft.http.PlayerSkinResponse"
        "404":
          description: Player not found
          headers: {}
      deprecated: false
    put:
      tags: []
      description: Change a player's skin
      parameters:
      - name: id
        in: path
        description: Player id
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/org.micoli.micraft.http.SetPlayerSkinRequest"
        required: false
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org.micoli.micraft.http.PlayerSkinResponse"
        "400":
          description: Invalid or unknown skin
          headers: {}
        "404":
          description: Player not found
          headers: {}
        "503":
          description: No persistence backend
          headers: {}
      deprecated: false
  /api/player/{id}/screenshots:
    post:
      tags: []
      description: "Upload a player screenshot (base64 PNG, optionally as a data:\
        \ URI)"
      parameters:
      - name: id
        in: path
        description: Player id
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/org.micoli.micraft.http.UploadScreenshotRequest"
        required: false
      responses:
        "201":
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org.micoli.micraft.http.UploadScreenshotResponse"
        "400":
          description: Invalid body or base64 data
          headers: {}
      deprecated: false
  /api/player/{id}/armors:
    get:
      tags: []
      description: Armor names currently equipped by a player
      parameters:
      - name: id
        in: path
        description: Player id
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  title: String
                title: List<String>
      deprecated: false
  /api/player/{id}/hands:
    get:
      tags: []
      description: Wielded weapon/tool names and dominant hand for a player
      parameters:
      - name: id
        in: path
        description: Player id
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org.micoli.micraft.http.PlayerHands"
      deprecated: false
  /api/player/{id}/owned:
    get:
      tags: []
      description: Armor/weapon/tool names owned by a player
      parameters:
      - name: id
        in: path
        description: Player id
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org.micoli.micraft.http.PlayerOwnedEquipment"
      deprecated: false
  /api/player/{id}/rpg:
    get:
      tags: []
      description: A player's RPG character class
      parameters:
      - name: id
        in: path
        description: Player id
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org.micoli.micraft.http.PlayerRpgResponse"
        "404":
          description: Player or RPG character not found
          headers: {}
      deprecated: false
  /api/character/create:
    post:
      tags: []
      description: Create a new (non-RPG) character
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/org.micoli.micraft.http.CreateCharacterRequest"
        required: false
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org.micoli.micraft.http.CreateCharacterResponse"
        "400":
          description: Invalid or missing fields
          headers: {}
        "503":
          description: No persistence backend
          headers: {}
      deprecated: false
  /api/character/rpgcreate:
    post:
      tags: []
      description: Create a new RPG character (point-buy base stats + class)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/org.micoli.micraft.http.CreateRpgCharacterRequest"
        required: false
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org.micoli.micraft.http.CreateRpgCharacterResponse"
        "400":
          description: Invalid fields or stat budget
          headers: {}
        "409":
          description: RPG character already exists
          headers: {}
        "503":
          description: No persistence backend
          headers: {}
      deprecated: false
  /api/skins:
    get:
      tags: []
      description: Names of all available player skins
      parameters: []
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  title: String
                title: List<String>
      deprecated: false
  /api/skins/{name}/config:
    get:
      tags: []
      description: "Skin config (eye offset, hidden bones) for a named skin"
      parameters:
      - name: name
        in: path
        description: Skin name
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org.micoli.micraft.game.skin.SkinDefinition"
        "404":
          description: Skin not found
          headers: {}
      deprecated: false
  /api/vehicles/{name}/config:
    get:
      tags: []
      description: "Vehicle model config (speed, seat offset) for a named vehicle"
      parameters:
      - name: name
        in: path
        description: Vehicle model name
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org.micoli.micraft.game.vehicle.VehicleModelDefinition"
        "404":
          description: Vehicle model not found
          headers: {}
      deprecated: false
  /api/armors:
    get:
      tags: []
      description: List all armor definitions
      parameters: []
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/org.micoli.micraft.game.armor.ArmorDefinition"
                title: "Map<String,ArmorDefinition>"
      deprecated: false
  /api/weapons:
    get:
      tags: []
      description: List all weapon definitions
      parameters: []
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/org.micoli.micraft.game.equipment.WeaponDefinition"
                title: "Map<String,WeaponDefinition>"
      deprecated: false
  /api/tools:
    get:
      tags: []
      description: List all tool definitions
      parameters: []
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/org.micoli.micraft.game.equipment.ToolDefinition"
                title: "Map<String,ToolDefinition>"
      deprecated: false
  /api/game-assets:
    get:
      tags: []
      description: 3D game asset files discovered under resources/game-assets
      parameters: []
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/org.micoli.micraft.http.GameAssetsController.AssetEntry"
                title: List<GameAssetsController.AssetEntry>
      deprecated: false
  /api/game-assets/file/{...}:
    get:
      tags: []
      description: Raw asset file bytes (glb/gltf/fbx/textures)
      parameters:
      - name: path
        in: path
        description: Relative asset path
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          headers: {}
          content:
            application/octet-stream:
              schema:
                type: array
                items:
                  type: integer
                  maximum: 127
                  minimum: -128
                  title: Byte
                title: Array<Byte>
        "404":
          description: Asset not found
          headers: {}
      deprecated: false
  /api/game-assets/blend-scene/{...}:
    get:
      tags: []
      description: Reads a .blend file's collection/object tree via headless Blender
        (cached)
      parameters:
      - name: path
        in: path
        description: Relative path to a .blend asset
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org.micoli.micraft.http.GameAssetsController.BlendSceneNode"
        "404":
          description: Asset not found
          headers: {}
        "500":
          description: Blender scene read failed
          headers: {}
      deprecated: false
  /api/game-assets/blend-cache/{...}:
    delete:
      tags: []
      description: Clears the cached Blender conversion (scene tree + all OBJ/bbmodel
        exports) for a .blend file
      parameters:
      - name: path
        in: path
        description: Relative path to a .blend asset
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "204":
          headers: {}
        "404":
          description: Asset not found
          headers: {}
      deprecated: false
  /api/game-assets/blend-preview/{...}:
    get:
      tags: []
      description: Converts a .blend file to OBJ/MTL via headless Blender (cached)
        and returns the OBJ asset path
      parameters:
      - name: path
        in: path
        description: Relative path to a .blend asset
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      - name: objects
        in: query
        description: Comma-separated object names to export; omit to export the whole
          scene
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org.micoli.micraft.http.GameAssetsController.BlendPreviewResponse"
        "404":
          description: Asset not found
          headers: {}
        "500":
          description: Blender conversion failed
          headers: {}
      deprecated: false
  /api/game-assets/bbmodel-export/{...}:
    get:
      tags: []
      description: Converts an OBJ/MTL mesh into a Blockbench-compatible mesh .bbmodel
        (cached). The generated mesh elements are not rendered by the admin viewer
        — open the result in Blockbench to edit it.
      parameters:
      - name: path
        in: path
        description: Relative path to a .obj asset
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org.micoli.micraft.http.GameAssetsController.BbmodelExportResponse"
        "404":
          description: Asset not found
          headers: {}
      deprecated: false
  /api/quests:
    get:
      tags: []
      description: All quest definitions
      parameters: []
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/org.micoli.micraft.http.QuestDto"
                title: List<QuestDto>
      deprecated: false
  /api/players/names:
    get:
      tags: []
      description: Names of all known players
      parameters: []
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  title: String
                title: List<String>
      deprecated: false
  /api/map/state:
    get:
      tags: []
      description: "Live players, NPCs and weather zones for the map overlay"
      parameters: []
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org.micoli.micraft.http.MapStateResponse"
        "401":
          description: Missing or invalid token
          headers: {}
      deprecated: false
  /api/map/terrain:
    get:
      tags: []
      description: Cached terrain summary JSON for the map overlay
      parameters: []
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: string
                title: String
        "401":
          description: Missing or invalid token
          headers: {}
      deprecated: false
  /api/map/voronoi:
    get:
      tags: []
      description: Voronoi biome cells around a point
      parameters:
      - name: cx
        in: query
        description: Center X (default 0)
        required: false
        deprecated: false
        explode: false
        schema:
          type: integer
          format: int32
          title: Int
      - name: cz
        in: query
        description: Center Z (default 0)
        required: false
        deprecated: false
        explode: false
        schema:
          type: integer
          format: int32
          title: Int
      - name: radius
        in: query
        description: Radius in blocks (default 800)
        required: false
        deprecated: false
        explode: false
        schema:
          type: integer
          format: int32
          title: Int
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/org.micoli.micraft.http.VoronoiCellInfo"
                title: List<VoronoiCellInfo>
        "401":
          description: Missing or invalid token
          headers: {}
      deprecated: false
  /api/map/houses:
    get:
      tags: []
      description: Generated houses within an area
      parameters:
      - name: cx
        in: query
        description: Center X (default 0)
        required: false
        deprecated: false
        explode: false
        schema:
          type: integer
          format: int32
          title: Int
      - name: cz
        in: query
        description: Center Z (default 0)
        required: false
        deprecated: false
        explode: false
        schema:
          type: integer
          format: int32
          title: Int
      - name: radius
        in: query
        description: Radius in blocks (default 800)
        required: false
        deprecated: false
        explode: false
        schema:
          type: integer
          format: int32
          title: Int
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/org.micoli.micraft.http.HouseMapInfo"
                title: List<HouseMapInfo>
        "401":
          description: Missing or invalid token
          headers: {}
      deprecated: false
  /api/map/staircases:
    get:
      tags: []
      description: Named staircase points for the map overlay
      parameters: []
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/org.micoli.micraft.http.StaircaseMapInfo"
                title: List<StaircaseMapInfo>
        "401":
          description: Missing or invalid token
          headers: {}
      deprecated: false
  /api/map/roads:
    get:
      tags: []
      description: Road vertex segments within an area
      parameters:
      - name: cx
        in: query
