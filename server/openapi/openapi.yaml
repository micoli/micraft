        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  title: String
                title: List<String>
      deprecated: false
components:
  schemas:
    org.micoli.micraft.ui.WidgetRegistryEntry:
      type: object
      properties:
        editorColor:
          type: string
          title: String
        editorLabel:
          type: string
          title: String
        flow:
          type: boolean
          title: Boolean
        h:
          type: integer
          format: int32
          title: Int
        minH:
          type: integer
          format: int32
          title: Int
        minW:
          type: integer
          format: int32
          title: Int
        type:
          $ref: "#/components/schemas/org.micoli.micraft.ui.WidgetType"
        w:
          type: integer
          format: int32
          title: Int
        x:
          type: integer
          format: int32
          title: Int
        "y":
          type: integer
          format: int32
          title: Int
      required:
      - editorColor
      - editorLabel
      - flow
      - h
      - minH
      - minW
      - type
      - w
      - x
      - "y"
      title: WidgetRegistryEntry
    org.micoli.micraft.ui.WidgetType:
      type: string
      enum:
      - MINIMAP
      - HUD
      - SHORTCUT_BAR
      - CHAT_HISTORY
      - INPUT_BOX
      - INVENTORY
      - CHUNK_DEBUG
      - INGAME_MAP
      - ATTACK_PANEL
      - PLAYER_STATUS
      - COMBAT_TARGET
      - XP_BAR
      - AGGRO_INDICATORS
      - STATISTICS
      - QUEST_TRACKER
      - BUFF_BAR
      title: WidgetType
    org.micoli.micraft.http.ServerInfo:
      type: object
      properties:
        buildTimestamp:
          type: string
          title: String
      required:
      - buildTimestamp
      title: ServerInfo
    org.micoli.micraft.game.classes.ClassAttackAccess:
      type: object
      properties:
        attack:
          type: string
          title: String
        level:
          type: integer
          format: int32
          title: Int
      required:
      - attack
      - level
      title: ClassAttackAccess
    org.micoli.micraft.game.macro.MacroContextVar:
      type: object
      properties:
        children:
          type: array
          items:
            type: string
            title: String
          title: List<String>
        name:
          type: string
          title: String
        type:
          type: string
          title: String
      required:
