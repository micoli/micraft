  /api/game-assets/file/{...}:
    get:
      tags: []
      description: Raw asset file bytes (glb/gltf/fbx/textures)
      parameters:
      - name: path
        in: path
        description: Relative asset path
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          headers: {}
          content:
            application/octet-stream:
              schema:
                type: array
                items:
                  type: integer
                  maximum: 127
                  minimum: -128
                  title: Byte
                title: Array<Byte>
        "404":
          description: Asset not found
          headers: {}
      deprecated: false
  /api/quests:
    get:
      tags: []
