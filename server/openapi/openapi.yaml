  /api/player/{id}/skin:
    get:
      tags: []
      description: A player's current skin
      parameters:
      - name: id
        in: path
        description: Player id
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org.micoli.micraft.http.PlayerSkinResponse"
        "404":
          description: Player not found
          headers: {}
      deprecated: false
    put:
      tags: []
      description: Change a player's skin
      parameters:
      - name: id
        in: path
        description: Player id
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/org.micoli.micraft.http.SetPlayerSkinRequest"
        required: false
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/org.micoli.micraft.http.PlayerSkinResponse"
        "400":
          description: Invalid or unknown skin
          headers: {}
        "404":
          description: Player not found
          headers: {}
        "503":
          description: No persistence backend
          headers: {}
      deprecated: false
  /api/player/{id}/screenshots:
