  /api/keybindings:
    get:
      tags: []
      description: "Key bindings — a player's saved bindings if ?player= is given\
        \ and persistence is available, otherwise the default config"
      parameters:
      - name: player
        in: query
        description: Optional player name to load saved bindings for
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                    title: String
                  title: List<String>
                title: "Map<String,List<String>>"
      deprecated: false
  /api/autocomplete/{commandId}/{argIndex}:
    get:
      tags: []
      description: Autocomplete suggestions for a slash command argument
      parameters:
      - name: commandId
        in: path
        description: Slash command id
        required: true
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      - name: argIndex
        in: path
        description: Zero-based argument index
        required: true
        deprecated: false
        explode: false
        schema:
          type: integer
          format: int32
          title: Int
      - name: partial
        in: query
        description: Partial text typed so far
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      - name: player
        in: query
        description: Requesting player name
        required: false
        deprecated: false
        explode: false
        schema:
          type: string
          title: String
      responses:
        "200":
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  title: String
                title: List<String>
        "400":
          description: Missing commandId or argIndex
          headers: {}
      deprecated: false
