# Reuses the adult's Blockbench model at a smaller scale, exactly as duck_baby reuses duck's.
# No new art asset is needed for a species to have young.
bbmodelFile: polar_bear
walkBoneAliases:
  rightArm: leg0
  leftArm: leg1
  rightLeg: leg2
  leftLeg: leg3
behavior: animal
width: 0.35
height: 0.65
wanderSpeed: 1.5
wanderRadius: 20.0
spawn:
  # born, never spawned: an apex predator's young appear through reproduction only
  autoSpawn: false
  maxPerChunk: 2
  spawnBiomes: []
  # world-wide ceiling; the floor below is what the spawner restocks up to
  maxTotal: 25
  minTotal: 0
hp: 12
aggroMode: PASSIVE
aggroRange: 4.0
deaggroTimeSec: 5.0
characterClass: WARRIOR
baseStats:
  str: 7
  dex: 8
  intel: 6
  wis: 8
  con: 9
  cha: 6
animal:
  diet: CARNIVORE
  lifespanDays: 40.0
  canReproduce: false
  adultType: polar_bear
  # a slow-breeding apex also grows slowly; well inside the 40-day lifespan
  growthDays: 8.0
  scale: 0.6
  baseStats:
    str: 7
    dex: 8
    intel: 6
    wis: 8
    con: 9
    cha: 6
  statsVariance: 1
  hpRegenPerSec: 0.3
  foodSearchRadius: 20.0
  roamRadius: 25.0
  hungerRatePerDay: 0.07
  feedHungerReduction: 0.5
  hungerThresholdToHunt: 0.99
  hungerThresholdToMate: 0.99
  # ── Starvation ──
  starvationThreshold: 1.0
  starvationAttackMultiplier: 0.5
  starvationSpeedMultiplier: 0.2
  starvationSterile: true
  starvationDeathDays: 3.0
  # ── Gestation ──
  gestationAttackMultiplier: 1.0
  gestationSpeedMultiplier: 1.0
