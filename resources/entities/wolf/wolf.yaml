walkBoneAliases:
  rightArm: leg0
  leftArm: leg1
  rightLeg: leg2
  leftLeg: leg3
behavior: animal
width: 0.5
height: 0.9
wanderSpeed: 2.0
wanderRadius: 55.0
spawn:
  autoSpawn: true
  maxPerChunk: 3
  spawnBiomes: []
  # world-wide ceiling; the floor below is what the spawner restocks up to
  maxTotal: 60
  minTotal: 45
hp: 18
aggroMode: AGGRESSIVE
aggroRange: 6.0
deaggroTimeSec: 10.0
minLevel: 0
characterClass: WARRIOR
