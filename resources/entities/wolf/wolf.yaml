  str: 14
  dex: 10
  intel: 8
  wis: 8
  con: 12
  cha: 6
attacks:
  - attackId: wolf_bite
    level: 2
  - attackId: wolf_pounce
    level: 2
pack:
  extendPackType:
    - wolf_veteran
  # a wider call: the pack has to gather before the prey walks off
  callRadius: 40.0
  relayHops: 3
  maxSize: 8
  # 3 wolves (18 hp each) lose to a polar bear (40 hp, 14/16-power strikes); 5 with a veteran do
  # not. A quorum that cannot win is a quorum that never kills — 568 packs formed for 8 bear kills.
  minSizeToEngage: 5
  callCooldownSec: 20.0
  rallyTimeoutSec: 20.0
  chaseRadius: 45.0
  hostileTypes:
    - polar_bear
animal:
  diet: CARNIVORE
  lifespanDays: 30.0
  preyTypes:
    - goat
    - duck
    - cat
  canReproduce: true
  gestationDays: 2.0
  offspringType: wolf_baby
  offspringMinCount: 1
  offspringMaxCount: 3
  reproductionCooldownDays: 5.0
  matingRange: 10.0
  scale: 1.0
  baseStats:
    str: 14
    dex: 10
    intel: 8
    wis: 8
    con: 12
    cha: 6
  statsVariance: 2
  hpRegenPerSec: 1.5
  hungerRatePerDay: 0.1
  hungerThresholdToHunt: 0.4
  hungerThresholdToMate: 0.5
  # stops breeding where the herd is already dense, not world-wide
  maxLocalDensity: 8
  densityRadius: 24.0
  # ── Starvation ──
  starvationThreshold: 1.0
  starvationAttackMultiplier: 0.5
  starvationSpeedMultiplier: 0.2
  starvationSterile: true
  starvationDeathDays: 3.0
  # ── Gestation ──
  gestationAttackMultiplier: 0.6
  gestationSpeedMultiplier: 0.7
