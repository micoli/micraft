behavior: quest_giver
chat:
  dialoguePrompt: >
    You are a reclusive hermit living in the wilderness, gruff but kind-hearted.
    Speak in short, weathered sentences. You know the surrounding zones well and
    can point travelers toward tasks worth doing, or reward a good conversation
    with something from your pouch if they earn your trust.
width: 0.6
height: 1.8
wanderSpeed: 0.8
wanderRadius: 8.0
hp: 20
aggroMode: PASSIVE
tier: COMMON
spawn:
  # Quest givers are placed by QuestGiverSpawner (one per zone cell), never by the generic
  # autoSpawn pass — leaving autoSpawn on here would double-spawn wandering hermits.
  autoSpawn: false
  maxPerChunk: 1
  spawnBiomes: [forest, pine_forest, snow_peaks]
  maxTotal: 15
  minTotal: 8
tameable: false
offersQuests:
  - zone_tier1_foxes.yaml
  - zone_tier1_flint.yaml
  - zone_tier1_rabbits.yaml
  - zone_tier1_sand.yaml
  - zone_tier1_owls.yaml
  - zone_tier2_boars.yaml
  - zone_tier2_gravel_run.yaml
  - zone_tier2_jackals.yaml
  - zone_tier2_sandstone_collection.yaml
  - zone_tier2_spiders.yaml
  - zone_tier3_scorpions.yaml
  - zone_tier3_sandstone_deep_run.yaml
  - zone_tier3_skeletons.yaml
  - zone_tier3_cobblestone_ruins.yaml
  - zone_tier3_bandits.yaml
  - zone_tier4_icewolves.yaml
  - zone_tier4_snow_gathering.yaml
  - zone_tier4_ghosts.yaml
  - zone_tier4_gravel_peaks.yaml
  - zone_tier4_eels.yaml
  - zone_tier5_yeti.yaml
  - zone_tier5_sandstone_haul.yaml
  - zone_tier5_sandworm.yaml
  - zone_tier5_cobblestone_haul.yaml
  - zone_tier5_golem.yaml
