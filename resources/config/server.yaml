world:
  worldMinY: 0
  worldMaxY: 256
  chunkSize: 16
  viewRadius: 3
  forwardViewRadius: 7
  waterLevel: 65
  impostorSkirtDepth: 12
player:
  heightStanding: 1.8
  heightSneaking: 1.5
  heightCrawling: 0.6
  width: 0.6
  eyeOffsetStanding: 1.62
  eyeOffsetSneaking: 1.27
  eyeOffsetCrawling: 0.4
  speedStanding: 4.5
  speedSneaking: 1.3
  speedCrawling: 1.0
auth:
  provider: none
  local:
    usersFile: data/config/auth/users.yaml
    groupsFile: data/config/auth/groups.yaml
chunks:
  transport: websocket
  httpWorkers: 4
network:
  messageEncoder: protobuf
game:
  tickMs: 50
  gravity: -20.0
  jumpSpeed: 8.5
  flyVerticalSpeed: 8.0
  saveIntervalSeconds: 30
  spawnX: 8.0
  spawnY: 200.0
  spawnZ: 8.0
  ticksPerDay: 72000
  timeBroadcastTicks: 20
  maxInteractionDistance: 14.0
  debugWorld: false
  reconcileToleranceXz: 0.5
  reconcileToleranceY: 0.99
  blockBreakBufferSize: 1000
factions:
  enabled: false
  friendlyFire: false
  changeCooldownSeconds: 0
  list: []
