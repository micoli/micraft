combat:
  combat_target_cycle: ["Tab"]
  combat_attack: [KeyR]
  console_toggle: [KeyH]

movement:
  forward: [KeyW, ArrowUp]
  backward: [KeyS, ArrowDown]
  strafe_right: [KeyD, ArrowRight]
  strafe_left: [KeyA, ArrowLeft]
  rotate_left: [KeyQ]
  rotate_right: [KeyE]
  sneak: [ShiftLeft]
  crawl: [ControlLeft]
  auto_forward: ["KeyW+KeyW", "ArrowUp+ArrowUp"]

flight:
  fly_toggle: ["Space+Space"]
  ascend: [Space]
  descend: [ShiftLeft]
  speed_up: [KeyP]
  speed_down: [KeyO]

ui:
  console_toggle: [KeyH]
  view_toggle: [KeyF]
  statistics_toggle: [KeyN]
  attack_panel_toggle: [KeyU]
  inventory: [KeyI]
  character: [KeyY]
  undo: ["Ctrl+KeyZ", "Cmd+KeyZ"]
  minimap_zoom_in: [k]
  minimap_zoom_out: [l]
  ingame_map: [m]
  layout_editor: [KeyG]
  dump_stats: [KeyV]
  craft: ["Alt+KeyC"]
  health_bar: [KeyB]
  screenshot: [KeyJ]
  quest_journal: ["Alt+KeyQ"]
  quest_tracking: [KeyT]

building:
  place_rotate: [KeyR]

hotbar:
  slot_1: [Digit1]
  slot_2: [Digit2]
  slot_3: [Digit3]
  slot_4: [Digit4]
  slot_5: [Digit5]
  slot_6: [Digit6]
  slot_7: [Digit7]
  slot_8: [Digit8]
  slot_9: [Digit9]
  slot_10: [Digit0]
