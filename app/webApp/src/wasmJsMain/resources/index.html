<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiCraft</title>
    <base href="/">
    <link rel="icon" id="favicon" href="/favicon.svg">
    <link rel="stylesheet" href="main.css">
    <style>
        @layer base {
            * { margin: 0; padding: 0; }
            body { overflow: hidden; background: #0a0a0f; }
            #renderCanvas {
                width: 100vw;
                height: 100vh;
                display: block;
                touch-action: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas" width="1280" height="720"></canvas>
    <div id="mc-ui"></div>
    <!-- Lets dynamically import()'d mini-game bundles (app/minigames/<name>/) resolve their bare
         react imports to the host's own instance (window.React, set by mc_bindings.js) instead of
         bundling a second copy — see app/minigames/README.md. -->
    <script type="importmap">
        {
            "imports": {
                "react": "/minigame-shims/react.js",
                "react/jsx-runtime": "/minigame-shims/react-jsx-runtime.js",
                "react-dom/client": "/minigame-shims/react-dom-client.js"
            }
        }
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("/sw.js").catch(function () {});
            });
        }
    </script>
    <script src="babylon.js"></script>
    <script src="babylonjs.loaders.js"></script>
    <script src="mc_bindings.js"></script>
    <script src="webApp.js"></script>
</body>
</html>
