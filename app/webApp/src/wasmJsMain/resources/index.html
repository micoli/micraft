<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiCraft</title>
    <link rel="icon" id="favicon" href="/favicon.svg">
    <link rel="stylesheet" href="main.css">
    <style>
        @layer base {
            * { margin: 0; padding: 0; }
            body { overflow: hidden; background: #0a0a0f; }
            #renderCanvas {
                width: 100vw;
                height: 100vh;
                display: block;
                touch-action: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas" width="1280" height="720"></canvas>
    <div id="mc-ui"></div>
    <script src="babylon.js"></script>
    <script src="mc_bindings.js"></script>
    <script src="webApp.js"></script>
</body>
</html>
