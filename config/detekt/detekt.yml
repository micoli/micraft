build:
  maxIssues: 0

config:
  validation: true

processors:
  active: true

console-reports:
  active: true

# ktfmt (spotless) already owns formatting — don't have detekt fight it.
formatting:
  active: false

complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
  TooManyFunctions:
    thresholdInClasses: 20
    thresholdInInterfaces: 20
    thresholdInObjects: 20

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  MaxLineLength:
    active: false

naming:
  active: true
