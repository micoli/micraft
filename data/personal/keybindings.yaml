# yaml-language-server: $schema=../schemas/keybindings.schema.json
# MicCraft key bindings
# Keys: PascalCase = e.code (physical position, e.g. KeyW, Space) — lowercase = e.key character (layout-aware, e.g. m, l)
# All values must be lists (use [Key] for single-key bindings).

movement:
  forward:      [KeyW, ArrowUp]
  backward:     [KeyS, ArrowDown]
  strafe_right: [KeyD, ArrowRight]
  strafe_left:  [KeyA, ArrowLeft]
  rotate_left:  [KeyQ]
  rotate_right: [KeyE]

stance:
  sneak: [ShiftLeft]
  crawl: [ControlLeft]

flight:
  fly_toggle: [Space]    # double-tap to toggle flying
  ascend:     [Space]    # hold while flying (also = jump on ground)
  descend:    [ShiftLeft]
  speed_up:   [KeyP]
  speed_down: [KeyO]

camera:
  view_toggle: [KeyF]

ui:
  hud_mode_cycle: [h]
  inventory: [KeyI]
  undo:      [Ctrl+KeyZ, Cmd+KeyZ]

minimap:
  minimap_zoom_in:  [l]
  minimap_zoom_out: [m]

slot:
  slot_1:  [1]
  slot_2:  [2]
  slot_3:  [3]
  slot_4:  [4]
  slot_5:  [5]
  slot_6:  [6]
  slot_7:  [7]
  slot_8:  [8]
  slot_9:  [9]
  slot_10: [0]
