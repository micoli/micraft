# yaml-language-server: $schema=../schemas/biomes.schema.json
voronoiCellSize: 256
voronoiBlendRadius: 20
biomes:
  - id: desert
    zones:
      - moistureMin: 0.0
        moistureMax: 0.25
    surface: SAND
    subsurface: SANDSTONE
    subsurfaceDepth: 4
    filler: STONE
    vegetation: []
    elevationMin: 40
    elevationMax: 65

  - id: plains
    zones:
      - moistureMin: 0.25
        moistureMax: 0.60
    surface: GRASS
    subsurface: DIRT
    subsurfaceDepth: 3
    filler: STONE
    vegetation:
      - type: flower
        density: 0.02
      - type: weed
        density: 0.05
    elevationMin: 48
    elevationMax: 78

  - id: forest
    zones:
      - moistureMin: 0.60
        moistureMax: 1.0
    surface: GRASS
    subsurface: DIRT
    subsurfaceDepth: 5
    filler: STONE
    vegetation:
      - type: oak_tree
        density: 0.1
      - type: weed
        density: 0.08
    elevationMin: 55
    elevationMax: 95

  - id: mountains
    zones:
      - moistureMin: 0.0
        moistureMax: 1.0
        altitudeMin: 80
        altitudeMax: 89
    surface: GRAVEL
    subsurface: STONE
    subsurfaceDepth: 2
    filler: STONE
    vegetation:
      - type: pine_tree
        density: 0.04
    elevationMin: 80
    elevationMax: 110

  - id: tundra
    zones:
      - moistureMin: 0.0
        moistureMax: 1.0
        altitudeMin: 90
        altitudeMax: 1024
    surface: SNOW
    subsurface: DIRT
    subsurfaceDepth: 3
    filler: STONE
    vegetation:
      - type: pine_tree_snow
        density: 0.03
    elevationMin: 90
    elevationMax: 120
