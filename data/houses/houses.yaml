# yaml-language-server: $schema=../schemas/houses.schema.json
enabled: true
gridCellSize: 48
clusterCheckRadius: 2
floorHeight: 4
maxHouseSize: 20

houseTypes:
  - id: cabin
    widthMin: 5
    widthMax: 8
    depthMin: 5
    depthMax: 8
    floorsMin: 1
    floorsMax: 1
    roofTypes: [extended_gabled]
    roomsMin: 2
    roomsMax: 4
    doorsMin: 1
    doorsMax: 1

  - id: house
    widthMin: 7
    widthMax: 12
    depthMin: 7
    depthMax: 12
    floorsMin: 1
    floorsMax: 2
    roofTypes: [flat, gabled, extended_gabled]
    roomsMin: 3
    roomsMax: 6
    doorsMin: 1
    doorsMax: 2

  - id: townhouse
    widthMin: 5
    widthMax: 8
    depthMin: 8
    depthMax: 15
    floorsMin: 2
    floorsMax: 3
    roofTypes: [flat]
    roomsMin: 4
    roomsMax: 8
    doorsMin: 1
    doorsMax: 1

defaultBiome:
  wallBlock: STONE
  roofBlock: GRAVEL
  floorBlock: STONE
  houseProbability: 0.0
  clusterBonus: 0.0
  allowedTypes: []

biomes:
  plains:
    wallBlock: OAK_LOG
    roofBlock: OAK_LEAVES
    floorBlock: DIRT
    houseProbability: 0.15
    clusterBonus: 0.25
    allowedTypes: [cabin, house, townhouse]
  desert:
    wallBlock: SANDSTONE
    roofBlock: SAND
    floorBlock: SANDSTONE
    houseProbability: 0.08
    clusterBonus: 0.10
    allowedTypes: [cabin, house]
  forest:
    wallBlock: OAK_LOG
    roofBlock: OAK_LEAVES
    floorBlock: DIRT
    houseProbability: 0.04
    clusterBonus: 0.05
    allowedTypes: [cabin]
  tundra:
    wallBlock: STONE
    roofBlock: SNOW
    floorBlock: STONE
    houseProbability: 0.05
    clusterBonus: 0.10
    allowedTypes: [cabin]
  mountains:
    wallBlock: STONE
    roofBlock: GRAVEL
    floorBlock: STONE
    houseProbability: 0.0
    clusterBonus: 0.0
    allowedTypes: []
