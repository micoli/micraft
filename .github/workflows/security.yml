name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# This repo is private without GitHub Advanced Security, so SARIF /
# code-scanning upload and CodeQL are unavailable. Findings are surfaced as
# workflow logs + build artifacts. Dependabot (alerts + security updates) and
# the dependency graph work without GHAS.

jobs:
  osv-scanner:
    name: OSV-Scanner (lockfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=./app/webApp/ts-src/package-lock.json
            --lockfile=./kotlin-js-store/yarn.lock

  gradle-dependency-submission:
    name: Gradle dependency graph
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/dependency-submission@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/webApp/ts-src/package-lock.json
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      - name: Gradle SBOM
        run: ./gradlew cyclonedxBom --no-daemon
      - name: npm SBOM
        working-directory: app/webApp/ts-src
        run: |
          npm ci
          npm sbom --sbom-format=cyclonedx --sbom-type=application > sbom-npm.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: |
            build/reports/*.json
            app/webApp/ts-src/sbom-npm.json
          retention-days: 90
          if-no-files-found: warn
