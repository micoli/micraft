name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts-typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/webApp/ts-src/package-lock.json
      - run: npm ci
        working-directory: app/webApp/ts-src
      - run: echo "export const MC_BUILD_TIMESTAMP = '20260718-12.22.06';" > app/webApp/ts-src/buildConfig.ts
      - run: npm run typecheck
        working-directory: app/webApp/ts-src
      - run: npm run lint
        working-directory: app/webApp/ts-src
      - run: npx playwright install chromium --with-deps
        working-directory: app/webApp/ts-src
      - run: npm run test-storybook:ci
        working-directory: app/webApp/ts-src

  check-docs:
    name: README commands doc up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew :server:checkCommandsDocs

  kotlin-test:
    name: Kotlin shared tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew :core:jvmTest :server:test
