name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ts-typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/webApp/ts-src/package-lock.json
      - run: npm ci
        working-directory: app/webApp/ts-src
      - run: echo "export const MC_BUILD_TIMESTAMP = '20260718-12.22.06';" > app/webApp/ts-src/buildConfig.ts
      - run: npm run typecheck
        working-directory: app/webApp/ts-src
      - run: npm run typecheck:e2e
        working-directory: app/webApp/ts-src
      - run: npm run lint
        working-directory: app/webApp/ts-src
      - run: npx playwright install chromium --with-deps
        working-directory: app/webApp/ts-src
      - run: npm run test-storybook:ci
        working-directory: app/webApp/ts-src
      - run: npm run screenshot-stories -- --check
        working-directory: app/webApp/ts-src

  check-docs:
    name: Generated docs up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      - run: ./gradlew :server:checkCommandsDocs :server:checkReferenceDocs --no-daemon

  # Compiles core + server once, runs the JVM tests, and produces the two artifacts the E2E job
  # needs: the runnable server install-dist and the built web client (build/web). The E2E job then
  # never touches Gradle or the WASM toolchain.
  build-and-test:
    name: Kotlin tests + build server & web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/webApp/ts-src/package-lock.json
      - run: npm ci
        working-directory: app/webApp/ts-src
      - run: echo "export const MC_BUILD_TIMESTAMP = 'e2e-ci';" > app/webApp/ts-src/buildConfig.ts

      - name: Kotlin tests + server install-dist + web client
        run: |
          ./gradlew --no-daemon \
            :core:jvmTest :server:test \
            :server:installDist \
            :app:webApp:copyResourcesToWebDist :app:webApp:copyStaticToWebDist
          (cd app/webApp/ts-src && npm run build:game)

      - name: Pack build outputs
        run: tar -czf build-outputs.tar.gz server/build/install/server app/webApp/build/web

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-outputs
          path: build-outputs.tar.gz
          retention-days: 1
          compression-level: 0

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: [build-and-test, ts-typecheck]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/webApp/ts-src/package-lock.json
      - run: npm ci
        working-directory: app/webApp/ts-src

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-outputs
      - name: Unpack prebuilt server + web client
        run: |
          tar -xzf build-outputs.tar.gz
          chmod +x server/build/install/server/bin/server

      - run: npx playwright install --with-deps chromium
        working-directory: app/webApp/ts-src

      - name: Start prebuilt E2E server
        run: |
          rm -rf data/world/e2e_default
          JAVA_OPTS="-Xmx768m" \
          MICRAFT_PORT=8091 \
          MICRAFT_WORLD_NAME=e2e_default \
          MICRAFT_E2E=1 \
          MICRAFT_E2E_BOUNDS=8x8 \
          MICRAFT_E2E_GROUND_Y=64 \
          MICRAFT_WEB_DIST="$GITHUB_WORKSPACE/app/webApp/build/web" \
          nohup ./server/build/install/server/bin/server > e2e-server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8091/api/auth/config >/dev/null; then
              echo "E2E server up after ${i} tries"; exit 0
            fi
            sleep 2
          done
          echo "E2E server did not become ready"; cat e2e-server.log; exit 1

      - run: npm run test:e2e
        working-directory: app/webApp/ts-src
        env:
          CI: "true"
          E2E_NO_SERVER: "1"

      - name: E2E server log
        if: failure()
        run: cat e2e-server.log || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            app/webApp/ts-src/playwright-report/
            app/webApp/ts-src/test-results/
          retention-days: 7
