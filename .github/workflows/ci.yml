name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ts-typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/webApp/ts-src/package-lock.json
      - run: npm ci
        working-directory: app/webApp/ts-src
      - run: echo "export const MC_BUILD_TIMESTAMP = '20260718-12.22.06';" > app/webApp/ts-src/buildConfig.ts
      - run: npm run typecheck
        working-directory: app/webApp/ts-src
      - run: npm run typecheck:e2e
        working-directory: app/webApp/ts-src
      - run: npm run lint
        working-directory: app/webApp/ts-src
      - run: npx playwright install chromium --with-deps
        working-directory: app/webApp/ts-src
      - run: npm run test-storybook:ci
        working-directory: app/webApp/ts-src
      - run: npm run screenshot-stories -- --check
        working-directory: app/webApp/ts-src

  check-docs:
    name: Generated docs up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      - run: ./gradlew :server:checkCommandsDocs :server:checkReferenceDocs --no-daemon

  detekt:
    name: Kotlin static analysis (detekt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      - run: ./gradlew detekt --no-daemon

  # JVM track: core + server compile/test, produces the runnable server install-dist. Runs on its
  # own runner in parallel with build-wasm (below) since the two share no task graph (jvm vs wasmJs
  # source sets) — only their outputs are merged, by the e2e job.
  build-jvm:
    name: Kotlin tests + build server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      - run: ./gradlew --no-daemon :core:jvmTest :server:test :server:installDist

      - name: Pack server dist
        run: tar -czf server-dist.tar.gz server/build/install/server

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-dist
          path: server-dist.tar.gz
          retention-days: 1
          compression-level: 0

  # WASM track: compiles core+webApp to Kotlin/Wasm and bundles the web client. Runs in parallel
  # with build-jvm (above) — see its comment.
  build-wasm:
    name: Build web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/webApp/ts-src/package-lock.json
      - run: npm ci
        working-directory: app/webApp/ts-src
      - run: echo "export const MC_BUILD_TIMESTAMP = 'e2e-ci';" > app/webApp/ts-src/buildConfig.ts

      - name: Web client (wasm + bundle)
        run: |
          ./gradlew --no-daemon \
            :app:webApp:copyResourcesToWebDist :app:webApp:copyStaticToWebDist
          (cd app/webApp/ts-src && npm run build:game)

      - name: Pack web dist
        run: tar -czf web-dist.tar.gz app/webApp/build/web

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: web-dist.tar.gz
          retention-days: 1
          compression-level: 0

  e2e:
    name: Browser E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [build-jvm, build-wasm, ts-typecheck]
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Multi-context specs (2-3 browser contexts each) get their own worker so two of them
          # never fight over the runner's 2 vCPU at once — that contention was causing timeouts.
          - name: heavy
            args: --project=heavy --workers=1
          - name: shard-1
            args: --project=default --shard=1/3
          - name: shard-2
            args: --project=default --shard=2/3
          - name: shard-3
            args: --project=default --shard=3/3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/webApp/ts-src/package-lock.json
      - run: npm ci
        working-directory: app/webApp/ts-src

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
      - name: Unpack prebuilt server + web client
        run: |
          tar -xzf server-dist.tar.gz
          tar -xzf web-dist.tar.gz
          chmod +x server/build/install/server/bin/server

      - run: npx playwright install --with-deps chromium
        working-directory: app/webApp/ts-src

      - name: Start prebuilt E2E server
        run: |
          rm -rf data/world/e2e_default
          JAVA_OPTS="-Xmx768m" \
          MICRAFT_PORT=8091 \
          MICRAFT_WORLD_NAME=e2e_default \
          MICRAFT_E2E=1 \
          MICRAFT_E2E_BOUNDS=8x8 \
          MICRAFT_E2E_GROUND_Y=64 \
          MICRAFT_WEB_DIST="$GITHUB_WORKSPACE/app/webApp/build/web" \
          nohup ./server/build/install/server/bin/server > e2e-server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8091/api/auth/config >/dev/null; then
              echo "E2E server up after ${i} tries"; exit 0
            fi
            sleep 2
          done
          echo "E2E server did not become ready"; cat e2e-server.log; exit 1

      - run: npx playwright test --config e2e/playwright.config.ts ${{ matrix.args }}
        working-directory: app/webApp/ts-src
        env:
          CI: "true"
          E2E_NO_SERVER: "1"

      - name: E2E server log
        if: failure()
        run: cat e2e-server.log || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}
          path: |
            app/webApp/ts-src/playwright-report/
            app/webApp/ts-src/test-results/
          retention-days: 7
