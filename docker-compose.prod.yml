services:
  server:
    build:
      context: .
      dockerfile: .docker/prod/Dockerfile
      target: server
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - world-data:/app/data/world
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:

volumes:
  world-data:
